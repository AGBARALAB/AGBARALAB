<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E290"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8A6E2F"/>
    </linearGradient>
    <linearGradient id="goldA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E290"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="#050505"/>

  <!-- Outer rim -->
  <circle cx="16" cy="16" r="15" fill="url(#gold)"/>

  <!-- Inner field -->
  <circle cx="16" cy="16" r="13" fill="#0a0f1a" stroke="#0EA5E9" stroke-width="0.6"/>

  <!-- Central A + infinity -->
  <g transform="translate(16, 16)">
    <!-- A legs (bold) -->
    <path d="M 0 -10 L -5 7 L -8 10 L -3 10 L -1 7 L 0 4 L 1 7 L 3 10 L 8 10 L 5 7 Z"
          fill="url(#goldA)"/>

    <!-- Infinity crossbar (bold) -->
    <path d="M -6 -2 C -9 -5, -4 -6, 0 -2 C 4 -6, 9 -5, 6 -2 C 4 1, -1 1, 0 -2 C -1 1, -4 1, -6 -2 Z"
          fill="#0EA5E9"/>

    <!-- Infinity cutout -->
    <path d="M -4 -2 C -5 -3, -3 -4, -2 -2 C -1 -1, 1 -1, 2 -2 C 3 -4, 5 -3, 4 -2 C 3 -1, 1 -1, 0 -2 C -1 -1, -3 -1, -4 -2 Z"
          fill="#0a0f1a"/>
  </g>
</svg>